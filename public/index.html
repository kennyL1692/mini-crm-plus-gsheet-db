<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
  <title>Mini CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%231a73e8'/><circle cx='12' cy='9' r='4' fill='white'/><path d='M4.5 19c1.6-3 4.3-4.5 7.5-4.5s5.9 1.5 7.5 4.5' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="brand-icon material-symbols-rounded" aria-hidden="true">contacts</span>
      <h1>Mini CRM</h1>
    </div>
    <div class="top-actions app-only">
      <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh" title="Refresh">
        <span class="material-symbols-rounded">refresh</span>
      </button>
      <button id="logout-btn" class="icon-btn" type="button" aria-label="Log out" title="Log out">
        <span class="material-symbols-rounded">logout</span>
      </button>
    </div>
    <div id="progress" class="progress" hidden><div class="progress-bar"></div></div>
  </header>

  <section id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card" novalidate>
      <span class="login-icon material-symbols-rounded" aria-hidden="true">lock</span>
      <h2>Sign in</h2>
      <p class="login-sub">Enter the password to open your CRM</p>
      <label class="field">
        <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
        <span>Password</span>
        <button type="button" id="toggle-pw" class="icon-btn pw-toggle" aria-label="Show password">
          <span class="material-symbols-rounded">visibility</span>
        </button>
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <p id="demo-hint" class="login-hint" hidden>Demo password: <strong>demo</strong></p>
      <button id="login-btn" type="submit" class="btn btn-filled login-btn">Sign in</button>
    </form>
  </section>

  <main class="container app-only">
    <div id="demo-banner" class="banner" hidden>
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <span><strong>Demo mode.</strong> Data is saved in this browser only. Add your Apps Script URL in <code>config.js</code> to use Google Sheets.</span>
    </div>

    <section class="stats" id="stats" aria-label="Summary"></section>

    <div class="search">
      <span class="material-symbols-rounded" aria-hidden="true">search</span>
      <input id="search" type="search" placeholder="Search name, company, phone, email" autocomplete="off" aria-label="Search contacts">
    </div>

    <div class="chips" id="chips" role="tablist" aria-label="Filter by status"></div>

    <section id="list" aria-live="polite"></section>
  </main>

  <button id="fab" class="fab app-only" type="button" aria-label="New contact">
    <span class="material-symbols-rounded">add</span>
    <span class="fab-label">New contact</span>
  </button>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="contact-form" method="dialog" novalidate>
      <div class="dialog-head">
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <span class="material-symbols-rounded">close</span>
        </button>
        <h2 id="dialog-title">New contact</h2>
        <button type="submit" class="btn btn-filled head-save">Save</button>
      </div>

      <div class="dialog-body">
        <label class="field">
          <input name="name" placeholder=" " required maxlength="200">
          <span>Name *</span>
        </label>
        <label class="field">
          <input name="company" placeholder=" " maxlength="200">
          <span>Company</span>
        </label>
        <div class="row-2">
          <label class="field">
            <input name="phone" type="tel" placeholder=" " maxlength="50" inputmode="tel">
            <span>Phone</span>
          </label>
          <label class="field">
            <input name="email" type="email" placeholder=" " maxlength="200" inputmode="email">
            <span>Email</span>
          </label>
        </div>
        <div class="row-2">
          <label class="field select">
            <select name="status">
              <option>Lead</option>
              <option>Prospect</option>
              <option>Customer</option>
              <option>Lost</option>
            </select>
            <span>Status</span>
          </label>
          <label class="field select">
            <select name="source">
              <option value="">—</option>
              <option>Facebook</option>
              <option>Instagram</option>
              <option>TikTok</option>
              <option>WhatsApp</option>
              <option>Website</option>
              <option>Referral</option>
              <option>Walk-in</option>
              <option>Other</option>
            </select>
            <span>Source</span>
          </label>
        </div>
        <label class="field">
          <textarea name="notes" placeholder=" " rows="4" maxlength="2000"></textarea>
          <span>Notes</span>
        </label>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </div>

      <div class="dialog-foot">
        <button type="button" id="delete-btn" class="btn btn-text danger" hidden>
          <span class="material-symbols-rounded">delete</span>Delete
        </button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-text" data-close>Cancel</button>
        <button type="submit" class="btn btn-filled">Save</button>
      </div>
    </form>
  </dialog>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite">
    <span id="snackbar-text"></span>
    <button id="snackbar-action" type="button" class="btn btn-text inverse" hidden></button>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
